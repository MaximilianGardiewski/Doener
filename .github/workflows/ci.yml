name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install check dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Run type domain schema and static checks
        run: npm run check
      - name: Parse Mcello PowerShell launch scripts
        shell: pwsh
        run: |
          $files = @(
            'scripts/dev-supabase.ps1',
            'scripts/demo-mcello.ps1',
            'scripts/demo-mcello-lan.ps1',
            'scripts/configure-mcello-lan-firewall.ps1',
            'scripts/stop-mcello-lan.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error "${file}:$($_.Extent.StartLineNumber): $($_.Message)"
              }
              exit 1
            }
          }
      - name: Build Mcello preview
        run: npm run build:preview
      - name: Build Lebtig portable preview
        run: npm run build:lebtig
      - name: Install Chromium smoke-test runtime
        timeout-minutes: 6
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Run existing Mcello public browser smokes
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/mcello-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          node tests/public-navigation.browser.mjs
          node tests/showcase-motion.browser.mjs
          node tests/mcello-gsap-adapter.browser.mjs
          node tests/mcello-store-v2.browser.mjs
          node tests/mcello-builder-core-v2.browser.mjs
          node tests/homepage-composition.browser.mjs
          node tests/brand-design-system.browser.mjs
          node tests/public-copy-tone.browser.mjs
      - name: GSAP reveal — normal takeover
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/mcello-gsap-reveal-normal.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          node tests/mcello-gsap-reveal.browser.mjs normal
      - name: GSAP reveal — vendor fallback
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/mcello-gsap-reveal-fallback.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          node tests/mcello-gsap-reveal.browser.mjs fallback
      - name: GSAP reveal — reduced motion
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/mcello-gsap-reveal-reduced.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          node tests/mcello-gsap-reveal.browser.mjs reduced
      - name: GSAP hero depth — normal fallback reduced
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/mcello-gsap-hero-depth.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          node tests/mcello-gsap-hero-depth.browser.mjs all
      - name: Run Lebtig public auth browser smoke
        run: |
          npm run preview:lebtig > /tmp/lebtig-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/ >/dev/null
          node tests/lebtig-public-auth.browser.mjs
