name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run domain and schema checks
        run: npm run check
      - name: Build Mcello preview
        run: npm run build:preview
      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run public responsive motion and homepage browser smokes
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/mcello-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          node tests/public-navigation.browser.mjs
          node tests/showcase-motion.browser.mjs
          node tests/homepage-composition.browser.mjs
