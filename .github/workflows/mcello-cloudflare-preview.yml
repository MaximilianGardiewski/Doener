name: Mcello Cloudflare Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to mirror into Cloudflare Preview
        required: true
        default: main
        type: string

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 3c8cdb28bcc2d6ff8d09e611a9eb3277
  CLOUDFLARE_PROJECT_NAME: mcello-preview-mirror
  CLOUDFLARE_PREVIEW_BRANCH: preview
  MCELLO_PREVIEW_URL: https://preview.mcello-preview-mirror.pages.dev

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: mcello-preview
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Cloudflare preview token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Environment secret CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false

      - name: Build preview-only Cloudflare mirror
        run: |
          npm run build:preview:cloudflare
          node scripts/check-cloudflare-preview-build.mjs

      - name: Ensure Direct Upload Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          status="$(curl --silent --show-error --output /tmp/cf-project.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$endpoint")"
          if [ "$status" = "200" ]; then
            echo "Cloudflare Pages project already exists."
          elif [ "$status" = "404" ]; then
            create_status="$(curl --silent --show-error --output /tmp/cf-project-create.json --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data '{"name":"mcello-preview-mirror","production_branch":"production-disabled"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")"
            test "$create_status" = "200" || { cat /tmp/cf-project-create.json; exit 1; }
            echo "Created preview-only Cloudflare Pages project."
          else
            cat /tmp/cf-project.json
            exit 1
          fi

      - name: Upload preview branch to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "$CLOUDFLARE_PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Mcello preview ${GITHUB_SHA}"

      - name: Wait for preview alias
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent "$MCELLO_PREVIEW_URL/preview/menu.json" >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Cloudflare preview alias did not become ready in time."
          exit 1

      - name: Install remote browser acceptance runtime
        timeout-minutes: 6
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Verify real online configurator and GSAP
        run: node tests/mcello-cloudflare-preview.browser.mjs

      - name: Print preview URLs
        run: |
          echo "Device Lab: ${MCELLO_PREVIEW_URL}/configurator-preview.html?presentation=mcello"
          echo "Direct Mcello: ${MCELLO_PREVIEW_URL}/?presentation=mcello#bestellen"
