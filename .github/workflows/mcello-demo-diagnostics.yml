name: Mcello Demo Diagnostics

on:
  pull_request:
    paths:
      - "apps/mcello/**"
      - "tests/mcello-demo-flow.browser.mjs"
      - "tests/mcello-presentation-builders.browser.mjs"
      - "tests/mcello-presentation-builder-lifecycle.browser.mjs"
      - "tests/mcello-demo-preparation.test.mjs"
      - "tests/mcello-presentation-builder-data.test.mjs"
      - "tests/mcello-lan-demo.test.mjs"
      - "scripts/bootstrap-local-staff.mjs"
      - "scripts/import-provisional-menu.mjs"
      - "scripts/import-mcello-presentation-builders.mjs"
      - "scripts/prepare-mcello-demo.mjs"
      - "scripts/demo-mcello.ps1"
      - "scripts/demo-mcello-lan.ps1"
      - "scripts/mcello-lan-proxy.mjs"
      - "scripts/configure-mcello-lan-firewall.ps1"
      - "scripts/stop-mcello-lan.ps1"
      - "data/mcello/menu-seed.provisional.json"
      - "data/mcello/builder-presentation.v1.json"
      - "supabase/**"
      - ".github/workflows/mcello-demo-diagnostics.yml"

concurrency:
  group: mcello-demo-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start clean local Supabase
        run: |
          supabase start
          supabase db reset --local

      - name: Prepare local presentation operators menu and Builder fixtures
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | sed -E 's/^([^=]+)="(.*)"$/\1=\2/' \
            > .env.local
          echo 'MCELLO_LOCATION_ID=00000000-0000-4000-8000-000000000001' >> .env.local
          node scripts/bootstrap-local-staff.mjs
          node scripts/import-provisional-menu.mjs
          node scripts/import-mcello-presentation-builders.mjs

      - name: Prove localhost-only presentation shop preparation
        run: node scripts/prepare-mcello-demo.mjs

      - name: Install Chromium
        timeout-minutes: 6
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Run full Mcello presentation flow through LAN ingress
        id: demo
        shell: bash
        run: |
          set -o pipefail
          runner_ip="$(hostname -I | tr ' ' '\n' | grep -E '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)' | head -n 1)"
          test -n "$runner_ip"
          echo "Using simulated LAN address: $runner_ip"

          MCELLO_PUBLIC_BASE_URL="http://${runner_ip}:4180" npm run preview:mcello > /tmp/mcello-demo-preview.log 2>&1 &
          preview_pid=$!
          MCELLO_LAN_ADDRESS="$runner_ip" MCELLO_LAN_PORT=4180 node scripts/mcello-lan-proxy.mjs > /tmp/mcello-demo-lan-proxy.log 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" "$preview_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent "http://${runner_ip}:4180/__mcello_lan_health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://${runner_ip}:4180/__mcello_lan_health" >/dev/null
          curl --fail --silent http://127.0.0.1:4173/api/health >/dev/null

          MCELLO_DEMO_URL="http://${runner_ip}:4180" node tests/mcello-presentation-builders.browser.mjs 2>&1 | tee /tmp/mcello-builder-browser.log
          MCELLO_DEMO_URL="http://${runner_ip}:4180" node tests/mcello-presentation-builder-lifecycle.browser.mjs 2>&1 | tee /tmp/mcello-builder-lifecycle.log
          MCELLO_DEMO_URL="http://${runner_ip}:4180" node tests/mcello-demo-flow.browser.mjs 2>&1 | tee /tmp/mcello-demo-browser.log

      - name: Capture database diagnostics
        if: always()
        run: |
          {
            echo '--- Active demo orders ---'
            docker exec supabase_db_business-web-factory psql -U postgres -d postgres -Atc "select order_number||'|'||state||'|'||customer_first_name from public.orders order by submitted_at desc limit 10" || true
            echo '--- Notification channel policy ---'
            docker exec supabase_db_business-web-factory psql -U postgres -d postgres -Atc "select kind||'|'||preferred_channel||'|'||coalesce(fallback_channel,'NULL') from public.order_notification_outbox order by created_at desc limit 10" || true
          } > /tmp/mcello-demo-db.log 2>&1

      - name: Upload demo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcello-demo-diagnostics
          path: |
            /tmp/mcello-builder-browser.log
            /tmp/mcello-builder-lifecycle.log
            /tmp/mcello-demo-browser.log
            /tmp/mcello-demo-preview.log
            /tmp/mcello-demo-lan-proxy.log
            /tmp/mcello-demo-db.log
          retention-days: 3
          if-no-files-found: warn

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
