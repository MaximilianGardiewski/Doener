name: Mcello wire Adobe cucumber v2

on:
  push:
    branches:
      - feat/mcello-notebook-design-slice-v1
    paths:
      - .github/workflows/mcello-wire-adobe-cucumber-v2.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/mcello-notebook-design-slice-v1
          fetch-depth: 0

      - name: Publish local cucumber master and wire runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/mcello/public/assets/ingredients/fresh
          curl -L --fail --retry 2 -o apps/mcello/public/assets/ingredients/fresh/cucumber-slice-master.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:7c2f9c4d-6e2c-430f-a02d-73bed3635455'
          python - <<'PY'
          from pathlib import Path
          import json, re

          asset_file = Path('apps/mcello/public/assets/ingredients/fresh/cucumber-slice-master.png')
          data = asset_file.read_bytes()
          if len(data) < 10000 or data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('downloaded cucumber master is not a valid PNG')

          asset_id = 'fresh-cucumber-slice-master-v1'
          public_path = '/assets/ingredients/fresh/cucumber-slice-master.png'
          repo_path = 'apps/mcello/public/assets/ingredients/fresh/cucumber-slice-master.png'

          js_path = Path('apps/mcello/public/doner-yufka-builder-v2.js')
          js = js_path.read_text(encoding='utf-8')
          if f'data-asset-id="{asset_id}"' not in js:
              start_marker = '        <g class="mc-food-layer mc-food-layer--gurke" data-food-layer="Gurke">'
              end_marker = '\n\n        <g class="mc-food-layer mc-food-layer--zwiebel"'
              start = js.index(start_marker)
              end = js.index(end_marker, start)
              new_block = '\n'.join([
                  '        <g class="mc-food-layer mc-food-layer--gurke" data-food-layer="Gurke" data-asset-id="fresh-cucumber-slice-master-v1">',
                  '          <image class="mc-fresh-raster mc-fresh-raster--cucumber" href="/assets/ingredients/fresh/cucumber-slice-master.png" x="210" y="278" width="340" height="174" preserveAspectRatio="xMidYMid meet"/>',
                  '        </g>',
              ])
              js_path.write_text(js[:start] + new_block + js[end:], encoding='utf-8')

          css_path = Path('apps/mcello/public/doner-yufka-builder-v2.css')
          css = css_path.read_text(encoding='utf-8')
          fresh_rule = '.mc-fresh-raster { pointer-events: none; filter: drop-shadow(0 4px 5px rgba(67, 42, 18, .15)); }'
          if fresh_rule not in css:
              anchor = '.mc-sauce-raster { pointer-events: none; filter: drop-shadow(0 4px 5px rgba(67, 42, 18, .18)); }\n'
              if anchor not in css:
                  raise SystemExit('fresh raster CSS insertion anchor missing')
              css_path.write_text(css.replace(anchor, anchor + fresh_rule + '\n', 1), encoding='utf-8')

          sw_path = Path('apps/mcello/public/sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          if public_path not in sw:
              match = re.search(r'const CACHE = "mcello-public-shell-v(\d+)";', sw)
              if not match:
                  raise SystemExit('service worker cache version missing')
              sw = re.sub(r'const CACHE = "mcello-public-shell-v\d+";', f'const CACHE = "mcello-public-shell-v{int(match.group(1)) + 1}";', sw, count=1)
              anchor = '  "/assets/ingredients/fresh/tomato-slice-master.png",\n'
              if anchor not in sw:
                  raise SystemExit('service worker tomato asset anchor missing')
              sw_path.write_text(sw.replace(anchor, anchor + f'  "{public_path}",\n', 1), encoding='utf-8')

          manifest_path = Path('data/mcello/asset-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          cucumber_asset = {
              'id': asset_id,
              'version': 1,
              'kind': 'ingredient-layer',
              'productFamilies': ['doner', 'yufka'],
              'slot': 'fresh.cucumber',
              'path': repo_path,
              'publicPath': public_path,
              'status': 'approved-runtime',
              'runtimeScope': 'presentation-only-local-demo',
              'documentary': False,
              'provenance': 'generated-product-visual',
              'mappingType': 'modifier-option',
              'domainMapping': {'presentationGroupKey': 'doner-yufka-gemuese', 'presentationOptionKey': 'gurke', 'productionOptionId': None},
              'productionMappingStatus': 'awaiting-owner-confirmed-domain-option-id',
              'generator': 'Adobe Firefly',
              'promptId': 'cucumber-slice-layer-v1',
              'generatedAt': '2026-08-25',
              'generationRequestId': 'd767ebd2-8b81-4656-a078-1a466d8b822f',
              'backgroundRemovalRequestId': '8407bb10-807b-4e45-9ca3-7a729231f9af',
              'cropRequestId': 'c3689f36-00ba-4cca-994a-8c3ec2a3eaee',
              'stagingOutput': 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:7c2f9c4d-6e2c-430f-a02d-73bed3635455',
              'stagingDimensions': {'width': 2174, 'height': 1116},
              'fireflyBoardId': 'urn:aaid:sc:EU:bea31d70-9090-4de1-9b2e-e4feeeec4ef7',
              'fireflyBoardEntityId': '5b68a677-f847-4335-8c79-24052ab7d31f',
              'zIndex': 50,
              'anchor': {'x': 0.5, 'y': 0.49},
              'animationPreset': 'ingredient.drop.light',
              'rendererBranch': 'interactive-builder',
              'runtimeDependency': True,
              'runtimeReady': True,
              'reusePolicy': 'grouped-four-slice-master-single-layer',
              'publishGatesPassed': ['asset-qa-approved', 'provenance-recorded', 'runtime-path-local-or-governed-media'],
              'qa': {'fourSlices': 'pass', 'transparentCutout': 'pass', 'cameraConsistency': 'pass', 'reusableMaster': 'pass', 'noDocumentaryClaim': 'pass'},
              'notes': 'One Adobe-generated grouped four-slice cucumber master is used as the presentation layer. Production modifier-option ID mapping remains pending owner-confirmed catalog truth.',
          }
          existing = next((a for a in manifest['assets'] if a.get('id') == asset_id), None)
          if existing:
              existing.clear()
              existing.update(cucumber_asset)
          else:
              idx = next((i for i, a in enumerate(manifest['assets']) if a.get('id') == 'doner-core-layer-pack-v1'), len(manifest['assets']))
              manifest['assets'].insert(idx, cucumber_asset)
          pack = next((a for a in manifest['assets'] if a.get('id') == 'doner-core-layer-pack-v1'), None)
          if pack:
              approved = pack.setdefault('qaApprovedRuntimeAssets', [])
              if asset_id not in approved:
                  approved.append(asset_id)
              pack['status'] = 'production-active-runtime-assets'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          prompt_path = Path('data/mcello/prompt-library.json')
          library = json.loads(prompt_path.read_text(encoding='utf-8'))
          prompt_entry = {
              'id': 'cucumber-slice-layer-v1',
              'tool': 'Adobe Firefly image_generate',
              'status': 'executed-qa-approved-runtime-demo',
              'usage': 'interactive-builder-layer-candidate',
              'targetSlot': 'fresh.cucumber',
              'assetKind': 'ingredient-layer',
              'requestId': 'd767ebd2-8b81-4656-a078-1a466d8b822f',
              'prompt': 'Create exactly FOUR isolated fresh cucumber slices for a premium döner / yufka ingredient layer. Photorealistic food asset, fresh crisp cucumber texture, pale green interior with visible seed pattern, darker green peel, slight natural moisture, appetizing and clean, studio-quality food rendering. Arrange the slices as a modular grouped ingredient layer suitable for an interactive sandwich builder. Keep them clearly separated but visually cohesive. Slightly elevated top-three-quarter camera matching an exploded döner ingredient stack, soft premium studio lighting from upper left, crisp realistic edges, generous clean neutral empty space around the grouped ingredient so it can be cleanly cut out. No bread, no plate, no table, no hands, no salad mix, no background scene, no sauces, no text, no packaging.',
              'negativePrompt': 'full sandwich, döner, kebab, bread, other vegetables, tomato, onion, lettuce, chopped cucumber pile, bowl, plate, garnish, countertop, hands, utensils, packaging, text, logo, watermark, illustration, cartoon, CGI, cropped edges',
              'generationRule': 'Generate exactly four cucumber slices as one grouped reusable master layer. Do not generate a whole sandwich or bake other ingredients into the asset.',
              'qaNote': 'Passed four-slice, transparent-cutout, top-three-quarter camera and reusable-master QA; published to a local runtime path for presentation-only demo scope.',
          }
          existing_prompt = next((p for p in library['prompts'] if p.get('id') == prompt_entry['id']), None)
          if existing_prompt:
              existing_prompt.clear()
              existing_prompt.update(prompt_entry)
          else:
              library['prompts'].append(prompt_entry)
          prompt_path.write_text(json.dumps(library, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = Path('tests/mcello-doner-yufka-builder-v2.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          if 'Gurke uses one governed local Adobe four-slice master' not in tests:
              marker = 'test("SauceDeck uses governed local Adobe sauce masters with no Adobe runtime dependency", async () => {'
              if marker not in tests:
                  raise SystemExit('cucumber test insertion marker missing')
              lines = [
                  'test("Gurke uses one governed local Adobe four-slice master with no Adobe runtime dependency", async () => {',
                  '  const id = "fresh-cucumber-slice-master-v1";',
                  '  const publicPath = "/assets/ingredients/fresh/cucumber-slice-master.png";',
                  '  const repoPath = "apps/mcello/public/assets/ingredients/fresh/cucumber-slice-master.png";',
                  '  assert.ok(js.includes(`data-asset-id=\\"${id}\\"`));',
                  '  assert.equal(js.split(`href=\\"${publicPath}\\"`).length - 1, 1, "the grouped cucumber master should be rendered once");',
                  '  assert.ok(sw.includes(publicPath));',
                  '  const file = await stat(new URL(repoPath, root));',
                  '  assert.ok(file.size > 10_000, `${repoPath} must be a real PNG asset`);',
                  '  const manifestAsset = assetManifest.assets.find((asset) => asset.id === id);',
                  '  assert.ok(manifestAsset, `${id} must be governed in the asset manifest`);',
                  '  assert.equal(manifestAsset.status, "approved-runtime");',
                  '  assert.equal(manifestAsset.runtimeScope, "presentation-only-local-demo");',
                  '  assert.equal(manifestAsset.runtimeReady, true);',
                  '  assert.equal(manifestAsset.slot, "fresh.cucumber");',
                  '  assert.equal(manifestAsset.publicPath, publicPath);',
                  '  assert.equal(manifestAsset.productionMappingStatus, "awaiting-owner-confirmed-domain-option-id");',
                  '  assert.match(manifestAsset.reusePolicy || "", /grouped-four-slice-master/i);',
                  '  const prompt = promptLibrary.prompts.find((entry) => entry.id === "cucumber-slice-layer-v1");',
                  '  assert.ok(prompt, "cucumber-slice-layer-v1 must be recorded in the prompt library");',
                  '  assert.equal(prompt.status, "executed-qa-approved-runtime-demo");',
                  '  assert.equal(prompt.targetSlot, "fresh.cucumber");',
                  '  assert.match(prompt.generationRule, /exactly four cucumber slices/i);',
                  '  assert.doesNotMatch(js + css, /photoshop-api|firefly\\.adobe|short-url/i);',
                  '});',
                  '',
                  '',
              ]
              tests = tests.replace(marker, '\n'.join(lines) + marker, 1)
              test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate Mcello static asset contract
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/mcello-doner-yufka-builder-v2.test.mjs

      - name: Commit cucumber runtime asset and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mcello-wire-adobe-cucumber-v1.yml .github/workflows/mcello-wire-adobe-cucumber-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(mcello): wire Adobe cucumber master'
          git push origin HEAD:feat/mcello-notebook-design-slice-v1
