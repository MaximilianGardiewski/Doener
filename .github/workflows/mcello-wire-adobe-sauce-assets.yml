name: Mcello wire Adobe sauce assets

on:
  push:
    branches:
      - feat/mcello-notebook-design-slice-v1
    paths:
      - .github/workflows/mcello-wire-adobe-sauce-assets.yml
      - scripts/wire-mcello-sauce-assets.mjs

permissions:
  contents: write

concurrency:
  group: mcello-wire-adobe-sauce-assets
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcello-notebook-design-slice-v1
          fetch-depth: 0

      - name: Wire governed local sauce masters into SauceDeck
        run: node scripts/wire-mcello-sauce-assets.mjs

      - name: Validate source and static contract
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/mcello/public/doner-yufka-builder-v2.js
          node --test tests/mcello-doner-yufka-builder-v2.test.mjs
          test -s apps/mcello/public/assets/ingredients/sauces/sauce-curry-master.png
          test -s apps/mcello/public/assets/ingredients/sauces/sauce-garlic-master.png
          test -s apps/mcello/public/assets/ingredients/sauces/sauce-spicy-master.png

      - name: Commit SauceDeck runtime wiring and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mcello/public/doner-yufka-builder-v2.js \
                  apps/mcello/public/doner-yufka-builder-v2.css \
                  apps/mcello/public/sw.js \
                  data/mcello/asset-manifest.json \
                  tests/mcello-doner-yufka-builder-v2.test.mjs \
                  tests/mcello-sauce-deck.browser.mjs
          git rm .github/workflows/mcello-wire-adobe-sauce-assets.yml scripts/wire-mcello-sauce-assets.mjs
          git commit -m "feat(mcello): wire Adobe sauce masters into SauceDeck"
          git push origin HEAD:feat/mcello-notebook-design-slice-v1
