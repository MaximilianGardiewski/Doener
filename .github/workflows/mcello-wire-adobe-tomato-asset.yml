name: Mcello wire Adobe tomato asset

on:
  push:
    branches:
      - feat/mcello-notebook-design-slice-v1
    paths:
      - .github/workflows/mcello-wire-adobe-tomato-asset.yml

permissions:
  contents: write

concurrency:
  group: mcello-wire-adobe-tomato-asset
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcello-notebook-design-slice-v1
          fetch-depth: 0

      - name: Download governed Adobe tomato master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/mcello/public/assets/ingredients/fresh
          curl -L --fail --retry 2 \
            -o apps/mcello/public/assets/ingredients/fresh/tomato-slice-master.png \
            'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:a12cf2b3-c7c0-4af1-8492-049427ed2d07'
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/mcello/public/assets/ingredients/fresh/tomato-slice-master.png')
          data = p.read_bytes()
          if len(data) < 10_000:
              raise SystemExit(f'tomato asset unexpectedly small: {len(data)} bytes')
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('tomato asset is not a PNG')
          print(f'tomato master: {len(data)} bytes')
          PY

      - name: Wire tomato master into FoodStage and governance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          js_path = root / 'apps/mcello/public/doner-yufka-builder-v2.js'
          sw_path = root / 'apps/mcello/public/sw.js'
          manifest_path = root / 'data/mcello/asset-manifest.json'
          prompt_path = root / 'data/mcello/prompt-library.json'
          test_path = root / 'tests/mcello-doner-yufka-builder-v2.test.mjs'

          public_path = '/assets/ingredients/fresh/tomato-slice-master.png'
          repo_path = 'apps/mcello/public/assets/ingredients/fresh/tomato-slice-master.png'
          asset_id = 'fresh-tomato-slice-master-v1'
          prompt_id = 'tomato-slice-layer-v1'

          js = js_path.read_text(encoding='utf-8')
          start_marker = '        <g class="mc-food-layer mc-food-layer--tomate" data-food-layer="Tomate">'
          end_marker = '\n\n        <g class="mc-food-layer mc-food-layer--gurke"'
          if start_marker not in js:
              if f'data-asset-id="{asset_id}"' not in js:
                  raise SystemExit('Tomate layer anchor not found')
          else:
              start = js.index(start_marker)
              end = js.index(end_marker, start)
              new_block = '''        <g class="mc-food-layer mc-food-layer--tomate" data-food-layer="Tomate" data-asset-id="fresh-tomato-slice-master-v1">
          <image class="mc-fresh-raster mc-fresh-raster--tomato" href="/assets/ingredients/fresh/tomato-slice-master.png" x="176" y="334" width="112" height="77" transform="rotate(-12 232 372)" preserveAspectRatio="xMidYMid meet"/>
          <image class="mc-fresh-raster mc-fresh-raster--tomato" href="/assets/ingredients/fresh/tomato-slice-master.png" x="298" y="317" width="118" height="81" transform="rotate(7 357 357)" preserveAspectRatio="xMidYMid meet"/>
          <image class="mc-fresh-raster mc-fresh-raster--tomato" href="/assets/ingredients/fresh/tomato-slice-master.png" x="430" y="340" width="112" height="77" transform="rotate(-8 486 378)" preserveAspectRatio="xMidYMid meet"/>
        </g>'''
              js = js[:start] + new_block + js[end:]
              js_path.write_text(js, encoding='utf-8')

          sw = sw_path.read_text(encoding='utf-8')
          m = re.search(r'const CACHE = "mcello-public-shell-v(\d+)";', sw)
          if not m:
              raise SystemExit('service worker cache version not found')
          next_version = int(m.group(1)) + 1
          sw = re.sub(r'const CACHE = "mcello-public-shell-v\d+";', f'const CACHE = "mcello-public-shell-v{next_version}";', sw, count=1)
          if public_path not in sw:
              anchor = '  "/assets/ingredients/sauces/sauce-curry-master.png", "/assets/ingredients/sauces/sauce-garlic-master.png", "/assets/ingredients/sauces/sauce-spicy-master.png",\n'
              if anchor not in sw:
                  raise SystemExit('service worker ingredient asset anchor not found')
              sw = sw.replace(anchor, anchor + f'  "{public_path}",\n', 1)
          sw_path.write_text(sw, encoding='utf-8')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          existing = next((asset for asset in manifest['assets'] if asset.get('id') == asset_id), None)
          tomato_asset = {
              'id': asset_id,
              'version': 1,
              'kind': 'ingredient-layer',
              'productFamilies': ['doner', 'yufka'],
              'slot': 'fresh.tomato',
              'path': repo_path,
              'publicPath': public_path,
              'status': 'approved-runtime',
              'runtimeScope': 'presentation-only-local-demo',
              'documentary': False,
              'provenance': 'generated-product-visual',
              'mappingType': 'modifier-option',
              'domainMapping': {
                  'presentationGroupKey': 'doner-yufka-gemuese',
                  'presentationOptionKey': 'tomate',
                  'productionOptionId': None,
              },
              'productionMappingStatus': 'awaiting-owner-confirmed-domain-option-id',
              'generator': 'Adobe Firefly',
              'promptId': prompt_id,
              'generatedAt': '2026-08-25',
              'generationRequestId': 'b44d4921-1810-4b31-9a82-d26ead463024',
              'backgroundRemovalRequestId': 'aa6709f0-73d2-4001-9b9e-a6ccb3d86f25',
              'cropRequestId': 'febc3a21-f777-43c0-a54a-30be60d777af',
              'adjustmentRequestId': '1f35ffe6-ab03-44a2-ac84-8f4fd7b24355',
              'stagingOutput': 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:a12cf2b3-c7c0-4af1-8492-049427ed2d07',
              'stagingDimensions': {'width': 1361, 'height': 930},
              'fireflyBoardId': 'urn:aaid:sc:EU:bea31d70-9090-4de1-9b2e-e4feeeec4ef7',
              'fireflyBoardEntityId': 'a6c369ae-1170-463a-b636-deebd8a6f837',
              'zIndex': 40,
              'anchor': {'x': 0.5, 'y': 0.53},
              'animationPreset': 'ingredient.drop.light',
              'rendererBranch': 'interactive-builder',
              'runtimeDependency': True,
              'runtimeReady': True,
              'reusePolicy': 'single-master-instanced-three-times-in-presentation-layer',
              'publishGatesPassed': ['asset-qa-approved', 'provenance-recorded', 'runtime-path-local-or-governed-media'],
              'qa': {
                  'singleSubject': 'pass',
                  'transparentCutout': 'pass',
                  'cameraConsistency': 'pass',
                  'reusableMaster': 'pass',
                  'noDocumentaryClaim': 'pass',
              },
              'notes': 'One Adobe-generated tomato-slice master is reused three times inside the presentation layer. Production modifier-option ID mapping remains intentionally pending owner-confirmed catalog truth.'
          }
          if existing:
              existing.clear(); existing.update(tomato_asset)
          else:
              pack_index = next((i for i,a in enumerate(manifest['assets']) if a.get('id') == 'doner-core-layer-pack-v1'), len(manifest['assets']))
              manifest['assets'].insert(pack_index, tomato_asset)
          pack = next((a for a in manifest['assets'] if a.get('id') == 'doner-core-layer-pack-v1'), None)
          if pack:
              approved = pack.setdefault('qaApprovedRuntimeAssets', [])
              if asset_id not in approved:
                  approved.append(asset_id)
              pack['status'] = 'production-active-runtime-assets'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          library = json.loads(prompt_path.read_text(encoding='utf-8'))
          prompt_entry = {
              'id': prompt_id,
              'tool': 'Adobe Firefly image_generate',
              'status': 'executed-qa-approved-runtime-demo',
              'usage': 'interactive-builder-layer-candidate',
              'targetSlot': 'fresh.tomato',
              'assetKind': 'ingredient-layer',
              'requestId': 'b44d4921-1810-4b31-9a82-d26ead463024',
              'prompt': 'Exactly ONE isolated fresh tomato slice for a premium photorealistic 2.5D Döner configurator ingredient asset. A single round red tomato cross-section slice, juicy translucent flesh, clearly visible seed chambers, natural moisture and realistic food texture, appetizing but not over-saturated. Camera: slightly elevated top-three-quarter view, matching an exploded Döner ingredient stack. Soft premium studio lighting from upper left, gentle dimensional highlights, crisp realistic edges. Center the slice with generous clean neutral empty space around it so it can be cleanly cut out and reused as a master asset. No plate, no bread, no kebab, no salad, no cucumber, no onion, no sauce, no hands, no utensils, no packaging, no text, no logo. Generate only the single tomato slice.',
              'negativePrompt': 'multiple tomato slices, whole tomato, vine, stem, plate, bowl, bread, döner, kebab, meat, lettuce, cucumber, onion, sauce, hands, utensils, table props, text, logo, watermark, illustration, cartoon, CGI, hard black shadow, cropped edges',
              'generationRule': 'Generate exactly one tomato-slice master. Reuse the same approved master deterministically for multiple visible slices in the presentation layer instead of generating a baked multi-slice composition.',
              'qaNote': 'Passed single-subject, transparent-cutout, top-three-quarter camera and reusable-master QA; published to a local runtime path for presentation-only demo scope.'
          }
          old_prompt = next((p for p in library['prompts'] if p.get('id') == prompt_id), None)
          if old_prompt:
              old_prompt.clear(); old_prompt.update(prompt_entry)
          else:
              library['prompts'].append(prompt_entry)
          prompt_path.write_text(json.dumps(library, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          marker = 'test("SauceDeck uses governed local Adobe sauce masters with no Adobe runtime dependency", async () => {'
          tomato_test = '''test("Tomate uses one governed local Adobe master instanced deterministically with no Adobe runtime dependency", async () => {
  const id = "fresh-tomato-slice-master-v1";
  const publicPath = "/assets/ingredients/fresh/tomato-slice-master.png";
  const repoPath = "apps/mcello/public/assets/ingredients/fresh/tomato-slice-master.png";
  assert.ok(js.includes(`data-asset-id="${id}"`));
  assert.equal(js.split(`href="${publicPath}"`).length - 1, 3, "one tomato master should be instanced three times");
  assert.ok(sw.includes(publicPath));
  const file = await stat(new URL(repoPath, root));
  assert.ok(file.size > 10_000, `${repoPath} must be a real PNG asset`);
  const manifestAsset = assetManifest.assets.find((asset) => asset.id === id);
  assert.ok(manifestAsset);
  assert.equal(manifestAsset.status, "approved-runtime");
  assert.equal(manifestAsset.runtimeScope, "presentation-only-local-demo");
  assert.equal(manifestAsset.runtimeReady, true);
  assert.equal(manifestAsset.slot, "fresh.tomato");
  assert.equal(manifestAsset.publicPath, publicPath);
  assert.equal(manifestAsset.productionMappingStatus, "awaiting-owner-confirmed-domain-option-id");
  assert.match(manifestAsset.reusePolicy || "", /single-master-instanced-three-times/i);
  const prompt = promptLibrary.prompts.find((entry) => entry.id === "tomato-slice-layer-v1");
  assert.ok(prompt);
  assert.equal(prompt.status, "executed-qa-approved-runtime-demo");
  assert.equal(prompt.targetSlot, "fresh.tomato");
  assert.match(prompt.generationRule, /exactly one tomato-slice master/i);
  assert.doesNotMatch(js + css, /photoshop-api|firefly\\.adobe|short-url/i);
});

'''
          if 'Tomate uses one governed local Adobe master instanced deterministically' not in tests:
              if marker not in tests:
                  raise SystemExit('static test insertion anchor not found')
              tests = tests.replace(marker, tomato_test + marker, 1)
              test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate tomato runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/mcello-doner-yufka-builder-v2.test.mjs
          node tests/mcello-sauce-deck.browser.mjs

      - name: Commit tomato runtime wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/mcello-wire-adobe-tomato-asset.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mcello/public/assets/ingredients/fresh/tomato-slice-master.png \
                  apps/mcello/public/doner-yufka-builder-v2.js \
                  apps/mcello/public/sw.js \
                  data/mcello/asset-manifest.json \
                  data/mcello/prompt-library.json \
                  tests/mcello-doner-yufka-builder-v2.test.mjs \
                  .github/workflows/mcello-wire-adobe-tomato-asset.yml
          git commit -m 'feat(mcello): wire Adobe tomato slice master'
          git push origin HEAD:feat/mcello-notebook-design-slice-v1
