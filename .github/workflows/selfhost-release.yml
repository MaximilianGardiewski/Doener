name: Self-host Release

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/vendor-mcello-gsap.mjs"
      - "supabase/migrations/**"
      - "infra/selfhost/**"
      - "tests/selfhost-release.test.mjs"
      - "tests/messaging-spend-boundary.test.mjs"
      - ".github/workflows/selfhost-release.yml"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/vendor-mcello-gsap.mjs"
      - "supabase/migrations/**"
      - "infra/selfhost/**"
      - "tests/selfhost-release.test.mjs"
      - "tests/messaging-spend-boundary.test.mjs"
      - ".github/workflows/selfhost-release.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  app-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release shell and gateway syntax
        run: |
          bash -n infra/selfhost/preflight.sh
          bash -n infra/selfhost/apply-migrations.sh
          bash -n infra/selfhost/backup-db.sh
          bash -n infra/selfhost/restore-drill.sh
          bash -n infra/selfhost/healthcheck.sh
          node --check infra/selfhost/container-entrypoint.mjs

      - name: Build Mcello app image from Git
        run: docker build -f infra/selfhost/Dockerfile -t mcello-app:${GITHUB_SHA} .

      - name: Run container read-only and verify liveness and messaging fail-closed boundary
        run: |
          docker run -d --name mcello-app-release-smoke \
            --read-only \
            --tmpfs /tmp:size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 127.0.0.1:4174:8080 \
            mcello-app:${GITHUB_SHA}
          trap 'docker rm -f mcello-app-release-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:4174/api/health; then
            docker logs mcello-app-release-smoke >&2 || true
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:4174/ >/dev/null
          curl --fail --silent http://127.0.0.1:4174/vendor/gsap/gsap.min.js >/dev/null
          curl --fail --silent http://127.0.0.1:4174/vendor/gsap/ScrollTrigger.min.js >/dev/null
          curl --fail --silent http://127.0.0.1:4174/vendor/gsap/Flip.min.js >/dev/null
          test "$(docker inspect -f '{{.Config.User}}' mcello-app-release-smoke)" = "node"
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' mcello-app-release-smoke)" = "true"

          dev_otp_status="$(curl --silent --output /tmp/mcello-dev-otp.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:4174/api/dev/otp/start \
            -H 'content-type: application/json' \
            --data '{"mobile":"+491701234567"}')"
          test "$dev_otp_status" = "404"
          grep -F 'DEVELOPMENT_ENDPOINT_DISABLED' /tmp/mcello-dev-otp.json >/dev/null
          if grep -F 'devCode' /tmp/mcello-dev-otp.json >/dev/null; then
            echo 'Production gateway leaked a development OTP code' >&2
            exit 1
          fi

          checkout_status="$(curl --silent --output /tmp/mcello-checkout.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:4174/api/checkout \
            -H 'content-type: application/json' \
            --data '{}')"
          test "$checkout_status" = "503"
          grep -F 'PRODUCTION_MESSAGING_NOT_CONFIGURED' /tmp/mcello-checkout.json >/dev/null

      - name: Validate production compose and preflight contract
        run: |
          cat > /tmp/mcello-app.env <<'EOF'
          NODE_ENV=production
          PUBLIC_SITE_URL=https://mcello.ci.example
          SUPABASE_URL=https://supabase.ci.example
          SUPABASE_ANON_KEY=ci-anon-key-000000000000000000000000000000000000000000000000
          SUPABASE_SERVICE_ROLE_KEY=ci-service-role-key-000000000000000000000000000000000000000000
          MCELLO_LOCATION_ID=00000000-0000-4000-8000-000000000001
          OTP_TTL_SECONDS=300
          EOF
          MCELLO_APP_ENV_FILE=/tmp/mcello-app.env \
            docker compose -f infra/selfhost/compose.app.yml config > /tmp/mcello-compose.rendered.yml
          grep -F '127.0.0.1' /tmp/mcello-compose.rendered.yml >/dev/null
          grep -F 'target: 8080' /tmp/mcello-compose.rendered.yml >/dev/null
          grep -F 'read_only: true' /tmp/mcello-compose.rendered.yml >/dev/null
          bash infra/selfhost/preflight.sh /tmp/mcello-app.env
