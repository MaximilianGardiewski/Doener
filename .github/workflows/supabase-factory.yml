name: Supabase Factory

on:
  pull_request:
    paths:
      - "packages/supabase-factory/**"
      - ".github/workflows/supabase-factory.yml"
      - "tsconfig.json"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "packages/supabase-factory/**"
      - ".github/workflows/supabase-factory.yml"
      - "tsconfig.json"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: supabase-factory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck monorepo
        run: npm run typecheck

      - name: Test Supabase Factory
        run: npm --workspace @business-web/supabase-factory test

      - name: Guard against Supabase Cloud management dependencies
        shell: bash
        run: |
          set -euo pipefail

          # Cloud project binding/login is never allowed in Factory source.
          if grep -R --line-number --exclude='*.test.ts' --exclude='README.md' \
            -E 'supabase[[:space:]]+login|supabase[[:space:]]+link|sbp_' \
            packages/supabase-factory/src; then
            echo 'Supabase Factory core must not depend on Supabase Cloud project binding.' >&2
            exit 1
          fi

          # SUPABASE_ACCESS_TOKEN may appear only in the explicit defensive
          # CLOUD_ENV_KEYS deny/unset lists used by direct self-hosted DB operators.
          token_hits="$(grep -R --line-number --exclude='*.test.ts' --exclude='README.md' \
            'SUPABASE_ACCESS_TOKEN' packages/supabase-factory/src || true)"
          if [[ -n "$token_hits" ]]; then
            unexpected="$(printf '%s\n' "$token_hits" | \
              grep -Ev '(migrations|backup)\.ts:.*const CLOUD_ENV_KEYS.*"SUPABASE_ACCESS_TOKEN"' || true)"
            if [[ -n "$unexpected" ]]; then
              printf '%s\n' "$unexpected"
              echo 'SUPABASE_ACCESS_TOKEN may only be referenced in defensive DB-operator unset lists.' >&2
              exit 1
            fi
          fi
