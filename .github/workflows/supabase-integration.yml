name: Supabase Integration

on:
  pull_request:
    paths:
      - "supabase/**"
      - "data/mcello/menu-seed.provisional.json"
      - "scripts/import-provisional-menu.mjs"
      - "scripts/bootstrap-local-staff.mjs"
      - "scripts/dev-supabase.sh"
      - "scripts/dev-supabase.ps1"
      - "apps/mcello/**"
      - "packages/supabase-adapter/**"
      - "packages/ordering/**"
      - "packages/notifications/**"
      - "tests/supabase-local.integration.mjs"
      - "tests/provisional-menu.integration.mjs"
      - "tests/scheduling.integration.mjs"
      - "tests/slot-capacity.integration.mjs"
      - "tests/notification-outbox.integration.mjs"
      - "tests/realtime-backoffice.integration.mjs"
      - ".github/workflows/supabase-integration.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "data/mcello/menu-seed.provisional.json"
      - "scripts/import-provisional-menu.mjs"
      - "scripts/bootstrap-local-staff.mjs"
      - "scripts/dev-supabase.sh"
      - "scripts/dev-supabase.ps1"
      - "apps/mcello/**"
      - "packages/supabase-adapter/**"
      - "packages/ordering/**"
      - "packages/notifications/**"
      - "tests/supabase-local.integration.mjs"
      - "tests/provisional-menu.integration.mjs"
      - "tests/scheduling.integration.mjs"
      - "tests/slot-capacity.integration.mjs"
      - "tests/notification-outbox.integration.mjs"
      - "tests/realtime-backoffice.integration.mjs"

concurrency:
  group: supabase-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from migrations and seed
        run: supabase db reset --local

      - name: Restart Realtime after schema rebuild
        run: |
          # The local Realtime CDC poller caches publication table OIDs. A db
          # reset rebuilds the schema/publication after Realtime has already
          # started, so restart only Realtime to bind CDC to the migrated OIDs.
          docker restart supabase_realtime_business-web-factory >/dev/null
          for attempt in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' supabase_realtime_business-web-factory 2>/dev/null || true)" = "true" ]; then
              sleep 2
              break
            fi
            sleep 1
          done

      - name: Export local API credentials
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            >> "$GITHUB_ENV"

      - name: Verify Realtime publication membership
        run: |
          published="$(docker exec supabase_db_business-web-factory psql -U postgres -d postgres -Atc "select tablename from pg_publication_tables where pubname='supabase_realtime' and schemaname='public' order by tablename")"
          printf '%s\n' "$published"
          for table in orders ordering_settings snoozes menu_products modifier_options; do
            printf '%s\n' "$published" | grep -Fx "$table" >/dev/null || { echo "Missing from supabase_realtime: $table" >&2; exit 1; }
          done

      - name: Import provisional Mcello menu
        run: node scripts/import-provisional-menu.mjs

      - name: Verify provisional menu safety
        run: node tests/provisional-menu.integration.mjs

      - name: Run real PostgREST/RPC order flow
        run: node tests/supabase-local.integration.mjs

      - name: Prove slots timeout and scheduled activation
        run: node tests/scheduling.integration.mjs

      - name: Prove atomic pickup-slot capacity
        run: node tests/slot-capacity.integration.mjs

      - name: Prove notification outbox lifecycle
        run: node tests/notification-outbox.integration.mjs

      - name: Prove realtime and backoffice role boundaries
        id: realtime_backoffice
        run: node tests/realtime-backoffice.integration.mjs

      - name: Dump Realtime diagnostics on failure
        if: failure() && steps.realtime_backoffice.outcome == 'failure'
        run: |
          echo '--- realtime container tail ---'
          docker logs --tail 250 supabase_realtime_business-web-factory || true
          echo '--- publication ---'
          docker exec supabase_db_business-web-factory psql -U postgres -d postgres -Atc "select pubname,schemaname,tablename from pg_publication_tables where pubname='supabase_realtime' order by tablename" || true

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
