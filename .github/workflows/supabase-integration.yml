name: Supabase Integration

on:
  pull_request:
    paths:
      - "supabase/**"
      - "packages/supabase-adapter/**"
      - "packages/ordering/**"
      - "tests/supabase-local.integration.mjs"
      - ".github/workflows/supabase-integration.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "packages/supabase-adapter/**"
      - "packages/ordering/**"
      - "tests/supabase-local.integration.mjs"

concurrency:
  group: supabase-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from migrations and seed
        run: supabase db reset --local

      - name: Export local API credentials
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            >> "$GITHUB_ENV"

      - name: Run real PostgREST/RPC order flow
        run: node tests/supabase-local.integration.mjs

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
