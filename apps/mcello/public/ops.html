<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#171715" />
  <title>Mcello Betrieb — Verfügbarkeit</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .ops-shell{width:min(calc(100% - 24px),1180px);margin:auto;padding:24px 0 80px}
    .ops-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}.ops-top h1{font-size:42px;margin-right:auto}
    .ops-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.ops-panel{background:#161613;border:1px solid rgba(255,255,255,.07);border-radius:24px;padding:18px}
    .ops-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}.ops-row:last-child{border-bottom:0}
    .ops-row>div:first-child{flex:1}.ops-row small{display:block;color:var(--muted);margin-top:3px}
    .ops-btn{border:1px solid var(--line);background:#29251c;color:var(--gold-2);border-radius:12px;padding:9px 12px;cursor:pointer}.ops-btn.danger{color:#efaea3}.ops-btn.good{color:#b9dc8c}
    .status-dot{width:9px;height:9px;background:var(--green);border-radius:50%;display:inline-block}.status-dot.offline{background:#b96e62}
    .group{margin:18px 0}.group h3{margin-bottom:4px}.message{min-height:24px;color:var(--muted)}
    @media(max-width:760px){.ops-grid{grid-template-columns:1fr}.ops-top h1{font-size:34px}}
  </style>
</head>
<body>
  <div class="prototype-banner">Lokaler Mitarbeiterbereich · Staff-Rolle · keine Preis-/Strukturänderungen</div>
  <main class="ops-shell">
    <div class="ops-top">
      <h1>Betrieb</h1>
      <span class="pill"><span class="status-dot offline" id="opsDot"></span> <span id="opsSync">Verbinden …</span></span>
      <a class="pill" href="/kds.html">KDS</a>
      <a class="pill" href="/">Public</a>
    </div>
    <div class="notice">Hier kann das Team nur operative Verfügbarkeit steuern. Preise, Kategorien und Texte bleiben Admin-Sache.</div>
    <p class="message" id="opsMessage"></p>
    <div class="ops-grid">
      <section class="ops-panel"><h2>Gerichte</h2><div id="productOps"></div></section>
      <section class="ops-panel"><h2>Zutaten & Optionen</h2><div id="modifierOps"></div></section>
    </div>
  </main>
  <script type="module" src="/ops.js"></script>
</body>
</html>
